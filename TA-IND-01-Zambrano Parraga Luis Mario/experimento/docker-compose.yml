services:
  rabbit1:
    image: rabbitmq:4.2.9-management
    container_name: taind01-rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: TAIND01RabbitMQCluster2026
      RABBITMQ_DEFAULT_USER: laboratorio
      RABBITMQ_DEFAULT_PASS: ClaveSoloLocal2026
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit1_data:/var/lib/rabbitmq

  rabbit2:
    image: rabbitmq:4.2.9-management
    container_name: taind01-rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: TAIND01RabbitMQCluster2026
      RABBITMQ_DEFAULT_USER: laboratorio
      RABBITMQ_DEFAULT_PASS: ClaveSoloLocal2026
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbit2_data:/var/lib/rabbitmq

  rabbit3:
    image: rabbitmq:4.2.9-management
    container_name: taind01-rabbit3
    hostname: rabbit3
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit3
      RABBITMQ_ERLANG_COOKIE: TAIND01RabbitMQCluster2026
      RABBITMQ_DEFAULT_USER: laboratorio
      RABBITMQ_DEFAULT_PASS: ClaveSoloLocal2026
    ports:
      - "127.0.0.1:5674:5672"
      - "127.0.0.1:15674:15672"
    volumes:
      - rabbit3_data:/var/lib/rabbitmq

volumes:
  rabbit1_data:
  rabbit2_data:
  rabbit3_data:
